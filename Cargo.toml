[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dm0-tech/greengage"

[workspace.dependencies]
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
thiserror = "2"
serde_json = "1"
hex = "0.4"
